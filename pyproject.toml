[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stdt"
version = "1.0.0"
description = "A terminal-based study tracker with a gradual 60-day study-goal progression"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["study", "tracker", "productivity", "cli"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Operating System :: OS Independent", "Environment :: Console"]
dependencies = []

[project.optional-dependencies]
color = ["colorama>=0.4.6"]

[project.scripts]
stdt = "stdt.cli:main"
stdt-predict = "stdt.prediction:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stdt = ["ascii.txt"]
